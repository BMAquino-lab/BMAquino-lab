<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Brian Aquino</title><desc id="desc">Software developer and designer. An animated gold glow moves gently across a dark background.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#ffd84d" stop-opacity=".54"/><stop offset=".48" stop-color="#d18a1a" stop-opacity=".22"/><stop offset="1" stop-color="#d18a1a" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#ffdc6b" stop-opacity="0"/><stop offset=".55" stop-color="#ffce42" stop-opacity=".85"/><stop offset="1" stop-color="#ffb329" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="1200" height="280" rx="18"/></clipPath>
  </defs>
  <style>
    @keyframes drift{0%{transform:translateX(-210px);opacity:.6}50%{transform:translateX(125px);opacity:1}100%{transform:translateX(-210px);opacity:.6}}
    @keyframes trace{0%,100%{opacity:.35}50%{opacity:.8}}
    @media (prefers-reduced-motion: no-preference){.glow{animation:drift 12s ease-in-out infinite}.trace{animation:trace 8s ease-in-out infinite}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="280" fill="#0c0d0d"/>
    <path d="M729 280 1200 90v190Z" fill="#15130e"/>
    <path d="M910 280 1200 158v122Z" fill="#1d180e"/>
    <ellipse class="glow" cx="710" cy="294" rx="510" ry="135" fill="url(#glow)"/>
    <path class="trace" d="M250 250c220-9 394-29 614-48 125-11 236-18 336-17" fill="none" stroke="url(#line)" stroke-width="2"/>
    <path d="M885 0c110 33 194 98 246 190M985 0c89 34 151 88 195 156" fill="none" stroke="#d9a63e" stroke-opacity=".22"/>
    <circle cx="135" cy="139" r="73" fill="#13120e" stroke="#a77a27" stroke-opacity=".58" stroke-width="1.5"/>
    <circle cx="135" cy="139" r="62" fill="none" stroke="#f4c857" stroke-opacity=".22"/>
    <text x="135" y="155" text-anchor="middle" fill="#f4c95a" font-family="Georgia,serif" font-size="51" letter-spacing="-5">BA</text>
    <text x="248" y="128" fill="#f8f7f1" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="72" letter-spacing="-2">Brian <tspan fill="#ffd34e">Aquino</tspan></text>
    <text x="251" y="176" fill="#d2cdbd" font-family="Segoe UI,Arial,sans-serif" font-size="26">Software developer &amp; designer</text>
    <path d="M251 200h72" stroke="#f6c64e" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
